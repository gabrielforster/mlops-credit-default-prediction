name: pipeline-mlops

# Um unico workflow executa o ciclo completo: ingestao -> ETL -> votacao -> competicao
# -> promocao -> previsoes -> MLflow. Qualquer falha interrompe o job antes da persistencia,
# entao uma promocao so passa a valer se o ciclo inteiro terminar com sucesso.
on:
  schedule:
    - cron: "0 9 * * 1" # toda segunda-feira, 09:00 UTC
  workflow_dispatch:
    inputs:
      novo_lote:
        description: "Publicar o proximo lote de dados antes do ciclo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pipeline-mlops
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout (estado persistido do ciclo anterior)
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar arquivo original da UCI
        uses: actions/cache@v4
        with:
          path: data/raw/source
          key: uci-350-30c6be3abd8dcfd3

      - name: Testes automatizados
        run: pytest -q

      - name: Executar ciclo (notebooks 01 a 05)
        id: ciclo
        env:
          NOVO_LOTE: ${{ github.event_name == 'schedule' || inputs.novo_lote }}
          PIPELINE_CYCLE_ID: ciclo_gha_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          if [ "$NOVO_LOTE" = "true" ]; then
            python -m src.pipeline --novo-lote
          else
            python -m src.pipeline
          fi
          echo "cycle_id=$PIPELINE_CYCLE_ID" >> "$GITHUB_OUTPUT"

      - name: Resumo do ciclo
        run: |
          cat reports/evidencias/comparacao_ciclos.md >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "reports/evidencias/${{ steps.ciclo.outputs.cycle_id }}/04_promocao.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar evidencias do run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            notebooks/
            models/modelo_vigente.json
            models/historico_promocoes.jsonl
          if-no-files-found: warn

      - name: Persistir estado no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/batches mlruns models reports notebooks
          if git diff --cached --quiet; then
            echo "Nada a persistir."
            exit 0
          fi
          git commit -m "chore(pipeline): registrar ${{ steps.ciclo.outputs.cycle_id }} [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
