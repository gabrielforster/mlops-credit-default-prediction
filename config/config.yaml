project:
  name: credit-default-prediction
  mlflow_experiment: credit-default-prediction

data:
  source:
    url: https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip
    file_name: default of credit card clients.xls
    sha256: 30c6be3abd8dcfd3e6096c828bad8c2f011238620f5369220bd60cfc82700933
    original_target: default payment next month
  target: default.payment.next.month
  id_column: ID
  random_state: 42
  # Particao deterministica da fonte em lotes que "chegam" ao longo do tempo.
  # A soma das fracoes dos lotes + inference_fraction deve ser 1.
  batches:
    fractions: [0.6, 0.2, 0.1]
    inference_fraction: 0.1
  validation:
    max_invalid_row_fraction: 0.01

evaluation:
  primary_metric: f1
  direction: maximize
  test_size: 0.2
  validation_size: 0.2

  # Metricas secundarias registradas para todo modelo (a primaria entra automaticamente).
  secondary_metrics: [precision, recall, accuracy, roc_auc]

features:
  voting:
    minimum_votes: 2
  k_best: 10
  rfe_features: 10
  random_forest_features: 10
  # Estimadores internos dos seletores (independentes dos modelos competidores).
  selector_params:
    random_forest:
      n_estimators: 200
      min_samples_leaf: 20
      class_weight: balanced
      n_jobs: -1
    rfe_logistic_regression:
      max_iter: 2000
      class_weight: balanced

# Modelo A e modelo B. A ordem define o desempate: em empate na metrica primaria vence o primeiro.
models:
  logistic_regression:
    enabled: true
    label: modelo_A
    params:
      C: 1.0
      class_weight: balanced
      max_iter: 2000
  random_forest:
    enabled: true
    label: modelo_B
    params:
      n_estimators: 150
      max_depth: 8
      min_samples_leaf: 20
      class_weight: balanced
      n_jobs: -1

promotion:
  enabled: true
  minimum_improvement: 0.01

paths:
  source_dir: data/raw/source
  batches_dir: data/raw/batches
  inference_file: data/raw/inferencia/novos_clientes.csv
  processed_dir: data/processed
  evidence_dir: reports/evidencias
  cycle_pointer: reports/ciclo_atual.json
  models_dir: models
  manifest: models/modelo_vigente.json
  promotion_history: models/historico_promocoes.jsonl
  mlruns_dir: mlruns
  predictions_dir: reports/previsoes

# Criterio 10: monitoramento de drift por PSI entre os dados do modelo vigente e o lote novo.
drift:
  enabled: true
  bins: 10
  thresholds:
    moderate: 0.1
    severe: 0.25
  # Com drift severo nos atributos eleitos, o desafiante (treinado com os dados novos)
  # pode substituir o vigente sem a melhoria minima: basta nao ser pior.
  relax_promotion_on_severe: true
